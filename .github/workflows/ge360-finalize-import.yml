name: Finalize exact Mautic import

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ge360-finalize-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official Mautic 7.x
        run: |
          git clone --depth 1 --recurse-submodules --branch 7.x https://github.com/mautic/mautic.git /tmp/mautic

      - name: Sync all upstream files except root Actions workflows
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/' \
            /tmp/mautic/ ./

      - name: Force-add complete upstream snapshot
        run: |
          git config user.name "GE360 Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f -A
          git commit -m "Finalize exact Mautic 7.x snapshot" || exit 0
          git push origin main
