name: Import Mautic upstream

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-mautic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official Mautic 7.x
        run: |
          git clone --depth 1 --recurse-submodules --branch 7.x https://github.com/mautic/mautic.git /tmp/mautic

      - name: Replace target contents with Mautic snapshot
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/mautic/. .
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit imported Mautic
        run: |
          git config user.name "GE360 Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import official Mautic 7.x into ge360-Mautic"
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
