name: Import Mautic upstream

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-mautic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official Mautic 7.x
        run: |
          git clone --depth 1 --recurse-submodules --branch 7.x https://github.com/mautic/mautic.git /tmp/mautic

      - name: Import Mautic files except upstream workflows
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/mautic/ ./

      - name: Commit imported Mautic
        run: |
          git config user.name "GE360 Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import official Mautic 7.x into ge360-Mautic" || exit 0
          git push origin main
