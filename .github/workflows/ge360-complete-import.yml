name: Complete Mautic ignored tracked files

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ge360-complete-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone official Mautic 7.x
        run: |
          git clone --depth 1 --recurse-submodules --branch 7.x https://github.com/mautic/mautic.git /tmp/mautic

      - name: Sync all upstream files except workflow directory
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/mautic/ ./

      - name: Force-add tracked upstream files ignored by Mautic rules
        run: |
          git config user.name "GE360 Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f -A
          git commit -m "Complete Mautic 7.x import including ignored tracked files" || exit 0
          git push origin main
